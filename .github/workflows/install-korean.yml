name: Install Korean localization
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore localized files
        run: |
          base64 --decode 2-korean-payload.b64 | tar -xz
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('tests/free-drive.test.js')
          p.write_text(p.read_text().replace('/^Chain/', '/^연속 기록/').replace('`Clock ${SHIFT_SECONDS} s`', '`남은 시간 ${SHIFT_SECONDS}초`').replace('/clock starts/', '/시간 시작/'))
          PYTHON
          git restore .github/workflows
          rm 2-korean-payload.b64
          git config user.name 'sigco3111'
          git config user.email 'sigco3111@users.noreply.github.com'
          git add .
          git commit -m 'Localize Citydriver 2 in Korean, preserve credits, fix Pages and PWA base'
          git push
